name: Build Termux Node.js Archives

on:
  workflow_dispatch:
    inputs:
      version:
        description: Node.js LTS version
        required: true
        type: string

  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch: aarch64
            url: https://grimler.se/termux-main/pool/main/n/nodejs-lts/nodejs-lts_${{ inputs.version }}_aarch64.deb

          - arch: arm
            url: https://grimler.se/termux-main/pool/main/n/nodejs-lts/nodejs-lts_${{ inputs.version }}_arm.deb

          - arch: i686
            url: https://grimler.se/termux-main/pool/main/n/nodejs-lts/nodejs-lts_${{ inputs.version }}_i686.deb

          - arch: x86_64
            url: https://grimler.se/termux-main/pool/main/n/nodejs-lts/nodejs-lts_${{ inputs.version }}_x86_64.deb

    steps:
      - uses: actions/checkout@v4

      - name: Download package
        run: |
          mkdir -p downloads
          curl -L "${{ matrix.url }}" \
            -o "downloads/nodejs-${{ matrix.arch }}.deb"

      - name: Extract package
        run: |
          mkdir -p work/${{ matrix.arch }}

          cd work/${{ matrix.arch }}

          # Extract the .deb
          ar x ../../downloads/nodejs-${{ matrix.arch }}.deb

          # Extract the filesystem
          mkdir rootfs
          tar -xf data.tar.* -C rootfs

      - name: Flatten to files/
        run: |
          mkdir -p output/${{ matrix.arch }}

          # Move contents of files/ to be the archive root
          cp -a \
            work/${{ matrix.arch }}/rootfs/data/data/com.termux/files/. \
            output/${{ matrix.arch }}/

      - name: Create archive
        run: |
          mkdir -p artifacts

          tar \
            -C output/${{ matrix.arch }} \
            -czf artifacts/nodejs-${{ matrix.arch }}.tar.gz \
            .

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-${{ matrix.arch }}
          path: artifacts/nodejs-${{ matrix.arch }}.tar.gz
  
  release:
      needs: build
      runs-on: ubuntu-latest

      steps:
        - uses: actions/download-artifact@v4
          with:
            path: release-assets

        - name: Display files
          run: find release-assets

        - name: Publish Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: v${{ inputs.version }}
            name: Node.js LTS ${{ inputs.version }}
            generate_release_notes: true
            files: |
              release-assets/**/nodejs-aarch64.tar.gz
              release-assets/**/nodejs-arm.tar.gz
              release-assets/**/nodejs-i686.tar.gz
              release-assets/**/nodejs-x86_64.tar.gz
