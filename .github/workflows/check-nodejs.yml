name: Check for new Node.js LTS

on:
  workflow_dispatch:

  schedule:
    # Every second Sunday at midnight UTC (approximately)
    - cron: '0 0 1,15 * 0'

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest Node.js LTS
        id: latest
        run: |
          VERSION=$(
            curl -fsSL https://grimler.se/termux-main/pool/main/n/nodejs-lts/ \
            | grep -oP 'nodejs-lts_\K[0-9.]+(?=_aarch64\.deb)' \
            | sort -V \
            | tail -n1
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check latest GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo none)

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Trigger build
        if: steps.release.outputs.tag != format('v{0}', steps.latest.outputs.version)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "build-nodejs.yml",
              ref: context.ref.replace("refs/heads/",""),
              inputs: {
                version: "${{ steps.latest.outputs.version }}"
              }
            })

      - name: Up-to-date
        if: steps.release.outputs.tag == format('v{0}', steps.latest.outputs.version)
        run: echo "Already running the latest Node.js LTS."
